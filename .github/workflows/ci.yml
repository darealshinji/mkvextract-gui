name: CI
on: [check_run, push, pull_request, workflow_dispatch]
jobs:
  build-project:
    runs-on: ubuntu-26.04
    steps:     
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install dependencies
        run: sudo apt-get install --no-install-recommends libjpeg-dev libpng-dev libfreetype-dev libpango1.0-dev libx11-dev libxft-dev libxext-dev libxinerama-dev libxrender-dev
      - name: Build
        run: ./build_fltk.sh && make

